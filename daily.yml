name: Kindle Daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 07:00 Buenos Aires (UTC-3)
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/main.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
